title: Simulated XDG autostart persistence drop
id: 88893965-54e2-40ac-8bc1-ef938d2d6452
status: experimental
description: Detects creation of an XDG autostart entry by a process outside the package manager, a common per-user persistence location.
references:
  - https://attack.mitre.org/techniques/T1547/013/
author: aptsim detection lab
date: 2026/11/01
tags:
  - attack.persistence
  - attack.t1547.013
logsource:
  product: linux
  category: file_event
detection:
  selection_path:
    TargetFilename|contains: '/.config/autostart/'
    TargetFilename|endswith: '.desktop'
  selection_writer:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/python3'
      - '/curl'
      - '/wget'
  filter_pkg:
    Image|startswith:
      - '/usr/bin/pacman'
      - '/usr/lib/systemd/'
  condition: selection_path and selection_writer and not filter_pkg
falsepositives:
  - Legitimate user-installed desktop applications
  - Configuration management tooling
level: medium

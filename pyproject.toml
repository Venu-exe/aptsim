[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptsim"
version = "0.1.0"
description = "Inert APT behaviour simulation framework for detection engineering labs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "aptsim lab"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aptsim = "aptsim.cli:main"

[project.urls]
Documentation = "https://example.invalid/aptsim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aptsim = ["plugins/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
